version: "3.9"
services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"  # Don't expose containers by default
      - "--entrypoints.web.address=:80"  # Web entry point on port 80
      - "--entrypoints.websecure.address=:443"  # HTTPS entry point on port 443
      - "--api.dashboard=true"  # Enable dashboard
      - "--api.insecure=true"  # This is for accessing the dashboard without authentication (optional)
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"  # Let's Encrypt HTTP challenge
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"  # Use the 'web' entrypoint for HTTP challenge
      - "--certificatesresolvers.myresolver.acme.email=${LETSENCRYPT_EMAIL}"  # Your email for Let's Encrypt
      - "--certificatesresolvers.myresolver.acme.storage=/acme.json"  # Path to store ACME certificates
    ports:
      - "80:80"   # HTTP (for Let's Encrypt HTTP challenge)
      - "443:443" # HTTPS
      - "8082:8080"  # Dashboard (accessible via port 8082)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Traefik needs access to Docker to discover services
      - ./traefik.yml:/etc/traefik/traefik.yml:ro  # Traefik configuration file
      - ./acme.json:/acme.json  # ACME storage for Let's Encrypt certificates (make sure it has correct permissions)
    restart: unless-stopped
    networks:
      - default

networks:
  default:
    external: true
    name: ${NETWORK_NAME}

# Ensure the file ./acme.json has proper permissions for Traefik to write certificates:
# chmod 600 ./acme.json
