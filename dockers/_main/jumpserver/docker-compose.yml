version: '3.8'

services:
  postgres:
    container_name: jumpserver_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
      - '/etc/localtime:/etc/localtime:ro'
    env_file:
      - .env
    environment:
      POSTGRES_USER: jumpserver
      POSTGRES_PASSWORD: jumpserver
      POSTGRES_DB: jumpserver
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpserver -d jumpserver"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - default


  redis:
    container_name: jumpserver_redis
    image: redis:7-alpine
    restart: unless-stopped

    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

    volumes:
      - 'redis-data:/data'
      - '/etc/localtime:/etc/localtime:ro'

    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - default



  jumpserver:
    container_name: jumpserver
    image: jumpserver/jms_all:v4.10.18
    restart: unless-stopped
    privileged: true

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      LOG_LEVEL: INFO

      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: jumpserver
      DB_PASSWORD: jumpserver
      DB_NAME: jumpserver

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    ports:
      - '8080:80'
      - '2222:2222'
      # - '30000-30100:30000-30100'

    volumes:
      - 'jumpserver-data:/opt/jumpserver/data'
      - 'koko-data:/opt/koko/data'
      - 'lion-data:/opt/lion/data'
      - 'chen-data:/opt/chen/data'
      - 'kael-data:/opt/kael/data'
      - '/etc/localtime:/etc/localtime:ro'

    networks:
      - default

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jumpserver.rule=Host(`ggllp.jumpserver.local`)"
      - "traefik.http.routers.jumpserver.entrypoints=web"
      - "traefik.http.services.jumpserver.loadbalancer.server.port=80"


volumes:
  postgres-data:
    name: jumpserver_postgres_data

  redis-data:
    name: jumpserver_redis_data

  jumpserver-data:
    name: jumpserver_data

  koko-data:
    name: jumpserver_koko_data

  lion-data:
    name: jumpserver_lion_data

  chen-data:
    name: jumpserver_chen_data

  kael-data:
    name: jumpserver_kael_data


networks:
  default:
    external: true
    name: ${NETWORK_NAME}
