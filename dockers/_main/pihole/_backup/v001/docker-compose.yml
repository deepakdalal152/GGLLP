version: "3.9"

services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: "admin"
      FTLCONF_dns_listeningMode: "all"
      FTLCONF_dns_upstreams: "8.8.8.8;1.1.1.1"
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./custom.list:/etc/pihole/custom.list
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    cap_add:
      - NET_ADMIN
    networks:
      - default

networks:
  default:
    external: true
    name: ${NETWORK_NAME}
