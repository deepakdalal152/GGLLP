services:
  postgres:
    image: postgres:16-alpine
    container_name: ayon_postgres
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayon"]
      interval: 5s
      timeout: 5s
      retries: 5

    expose: [5432]

    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "db:/var/lib/postgresql/data"
      
    environment:
      - "POSTGRES_USER=ayon"
      - "POSTGRES_PASSWORD=ayon"
      - "POSTGRES_DB=ayon"

  redis:
    image: redis:alpine
    container_name: ayon_redis
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

    expose: [6379]


  server:
    image: ynput/ayon:${AYON_STACK_SERVER_TAG:-latest}
    restart: unless-stopped
    container_name: ayon_server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/info"]
      interval: 10s
      timeout: 2s
      retries: 3

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    networks:
      - default
    expose: [5000]
    ports: 
      - ${AYON_STACK_SERVER_PORT:-5000}:5000

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ayon.rule=Host(`ggllp.ayon.local`)"
      - "traefik.http.services.ayon.loadbalancer.server.port=5000"

    volumes:
      - "./addons:/addons"
      - "./storage:/storage"

      # comment out the following line on Windows
      - "/etc/localtime:/etc/localtime:ro"

      # uncomment the following line if you need to work on the backend code
      # - "./backend:/backend"

volumes:
  db: {}

networks:
  default:
    external: true
    name: ${NETWORK_NAME}